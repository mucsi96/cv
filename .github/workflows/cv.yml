name: Build and release CV

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile CV with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: main.pdf
          if-no-files-found: error

  release:
    name: Publish PDF release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf

      - name: Create release with PDF attachment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: cv-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" main.pdf \
            --target "$GITHUB_SHA" \
            --title "Igor Bari CV — $RELEASE_TAG" \
            --notes "Compiled CV PDF for commit $GITHUB_SHA."
